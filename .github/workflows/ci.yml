name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # mise.toml pins pnpm, zune, rojo, run-in-roblox, and blink.
      - name: Setup toolchain
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package versions
        run: pnpm run check:versions

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Verify every package packs cleanly
        run: pnpm publish -r --dry-run --no-git-checks
